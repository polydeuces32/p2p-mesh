<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Mesh v3.5</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #111 0%, #252525 100%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #000; padding: 20px; border-bottom: 3px solid #ff6b35; text-align: center; }
    .title { font-size: 2.4rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
    .p2p { color: #ff6b35; display: inline-block; transform: rotate(-2deg); }
    .mesh { color: #4ecdc4; display: inline-block; transform: rotate(2deg); }
    .subtitle { display: inline-block; margin-top: 10px; padding: 8px 14px; background: #4ecdc4; color: #000; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem; }
    .container { flex: 1; display: grid; grid-template-columns: minmax(280px, 430px) 1fr; gap: 20px; padding: 20px; width: 100%; max-width: 1400px; margin: 0 auto; }
    .panel, .chat-area { background: #1e1e1e; border: 2px solid #4ecdc4; }
    .panel { border-color: #ff6b35; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
    .section { background: #151515; border: 1px solid #4ecdc4; padding: 14px; }
    .section-title { color: #ff6b35; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #4ecdc4; padding-bottom: 6px; margin-bottom: 12px; }
    label { display: block; color: #4ecdc4; font-weight: 800; text-transform: uppercase; font-size: 0.82rem; letter-spacing: 0.5px; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 12px; border: 2px solid #4ecdc4; background: #000; color: #fff; font-size: 1rem; font-weight: 700; margin-bottom: 10px; }
    textarea { min-height: 72px; resize: vertical; font-family: monospace; font-size: 0.78rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #ff6b35; }
    .btn { background: #ff6b35; color: #000; border: 0; padding: 12px 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin: 0 8px 8px 0; }
    .btn:hover { background: #4ecdc4; }
    .btn.secondary { background: #4ecdc4; }
    .btn.secondary:hover { background: #ff6b35; }
    .btn.danger { background: #ff3b30; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .status-indicator { padding: 8px 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; font-size: 0.82rem; margin-top: 6px; word-break: break-word; }
    .connected { background: #4ecdc4; color: #000; }
    .disconnected { background: #ff6b35; color: #000; }
    .fingerprint { color: #4ecdc4; font-family: monospace; font-size: 0.82rem; word-break: break-all; margin-top: 8px; }
    .peer-list { max-height: 210px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .peer-item { background: #252525; border-left: 4px solid #4ecdc4; padding: 10px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .peer-id { color: #fff; font-weight: 800; word-break: break-all; }
    .peer-state { color: #4ecdc4; font-size: 0.75rem; text-transform: uppercase; font-weight: 900; }
    .chat-area { display: flex; flex-direction: column; min-height: 520px; }
    .messages { flex: 1; padding: 18px; overflow-y: auto; border-bottom: 2px solid #4ecdc4; max-height: 600px; }
    .message { background: #292929; border-left: 4px solid #ff6b35; padding: 10px; margin-bottom: 12px; }
    .message.system { border-left-color: #4ecdc4; }
    .message.local { border-left-color: #ff6b35; }
    .message.remote { border-left-color: #4ecdc4; }
    .message.invalid { border-left-color: #ff3b30; }
    .message-time { color: #4ecdc4; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
    .message-sender { color: #ff6b35; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
    .message-content { margin-top: 6px; line-height: 1.4; }
    .signature-state { margin-top: 6px; color: #4ecdc4; font-size: 0.72rem; font-weight: 900; text-transform: uppercase; }
    .input-area { display: flex; gap: 10px; padding: 18px; background: #252525; }
    .input-area input { margin-bottom: 0; }
    .send-btn { min-width: 110px; }
    .note { font-size: 0.82rem; color: #ddd; line-height: 1.45; }
    code { color: #4ecdc4; }
    @media (max-width: 800px) { .container { grid-template-columns: 1fr; } .title { font-size: 2rem; } .input-area { flex-direction: column; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="title"><span class="p2p">P2P</span> <span class="mesh">MESH</span></div>
    <div class="subtitle">v3.5 Signed Identity + Reliability</div>
  </header>

  <main class="container">
    <aside class="panel">
      <section class="section">
        <div class="section-title">Cryptographic Identity</div>
        <button class="btn" onclick="initIdentity()">Create / Load Identity</button>
        <button class="btn secondary" onclick="exportPublicIdentity()">Export Public</button>
        <button class="btn danger" onclick="resetIdentity()">Reset</button>
        <div id="peerStatus" class="status-indicator disconnected">No identity loaded</div>
        <div id="fingerprintBox" class="fingerprint"></div>
        <label for="publicKeyBox">Public Identity</label>
        <textarea id="publicKeyBox" readonly placeholder="Generated public identity appears here"></textarea>
      </section>

      <section class="section">
        <div class="section-title">Signaling Network</div>
        <button class="btn" onclick="connectSignaling()">Connect</button>
        <button class="btn secondary" onclick="disconnectSignaling()">Disconnect</button>
        <div id="signalStatus" class="status-indicator disconnected">Offline</div>
      </section>

      <section class="section">
        <div class="section-title">Live Peers</div>
        <div id="peerList" class="peer-list"></div>
      </section>

      <section class="section">
        <div class="section-title">Direct Channel</div>
        <label for="targetPeer">Target Peer</label>
        <select id="targetPeer"></select>
        <button class="btn" onclick="connectToPeer()">Open P2P Channel</button>
        <button class="btn secondary" onclick="flushOutbox()">Retry Queue</button>
        <div id="channelStatus" class="status-indicator disconnected">No direct channel</div>
        <p class="note">v3.5 adds message IDs, acknowledgements, retry queue, heartbeat pings, and reconnect behavior.</p>
      </section>
    </aside>

    <section class="chat-area">
      <div id="messages" class="messages"></div>
      <div class="input-area">
        <input id="msgInput" type="text" placeholder="Type a signed direct peer message...">
        <button id="sendBtn" class="btn send-btn" onclick="sendMessage()">Send</button>
      </div>
    </section>
  </main>

  <script>
    let ws = null;
    let reconnectTimer = null;
    let heartbeatTimer = null;
    let manualDisconnect = false;
    let peerId = localStorage.getItem("p2p_mesh_peer_id") || "";
    let publicJwk = null;
    let privateJwk = null;
    let signingKeyPair = null;
    let remotePublicKeys = {};
    let peers = [];
    let selectedPeer = "";
    let pc = null;
    let dataChannel = null;
    let connectedPeer = "";
    let outbox = [];
    let pendingAcks = new Map();
    let seenMessages = new Set();

    const STORAGE_PUBLIC = "p2p_mesh_public_jwk";
    const STORAGE_PRIVATE = "p2p_mesh_private_jwk";
    const STORAGE_PEER = "p2p_mesh_peer_id";
    const iceServers = [{ urls: "stun:stun.l.google.com:19302" }];

    const peerStatus = document.getElementById("peerStatus");
    const fingerprintBox = document.getElementById("fingerprintBox");
    const publicKeyBox = document.getElementById("publicKeyBox");
    const signalStatus = document.getElementById("signalStatus");
    const channelStatus = document.getElementById("channelStatus");
    const peerList = document.getElementById("peerList");
    const targetPeer = document.getElementById("targetPeer");
    const messages = document.getElementById("messages");
    const input = document.getElementById("msgInput");

    async function initIdentity() {
      publicJwk = readJson(STORAGE_PUBLIC);
      privateJwk = readJson(STORAGE_PRIVATE);
      if (!publicJwk || !privateJwk) {
        const keyPair = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
        publicJwk = await crypto.subtle.exportKey("jwk", keyPair.publicKey);
        privateJwk = await crypto.subtle.exportKey("jwk", keyPair.privateKey);
        localStorage.setItem(STORAGE_PUBLIC, JSON.stringify(publicJwk));
        localStorage.setItem(STORAGE_PRIVATE, JSON.stringify(privateJwk));
      }
      signingKeyPair = {
        publicKey: await crypto.subtle.importKey("jwk", publicJwk, { name: "ECDSA", namedCurve: "P-256" }, true, ["verify"]),
        privateKey: await crypto.subtle.importKey("jwk", privateJwk, { name: "ECDSA", namedCurve: "P-256" }, true, ["sign"])
      };
      peerId = `pk-${await fingerprintPublicKey(publicJwk)}`;
      localStorage.setItem(STORAGE_PEER, peerId);
      remotePublicKeys[peerId] = publicJwk;
      renderIdentity();
      addSystemMessage(`v3.5 identity ready: ${peerId}`);
    }

    function resetIdentity() {
      if (!confirm("Reset local identity? This deletes your local private key.")) return;
      localStorage.removeItem(STORAGE_PUBLIC); localStorage.removeItem(STORAGE_PRIVATE); localStorage.removeItem(STORAGE_PEER);
      peerId = ""; publicJwk = null; privateJwk = null; signingKeyPair = null; publicKeyBox.value = "";
      renderIdentity(); addSystemMessage("Local identity reset.");
    }

    function exportPublicIdentity() {
      if (!publicJwk || !peerId) return alert("Create or load identity first.");
      const identity = JSON.stringify({ peer_id: peerId, public_jwk: publicJwk }, null, 2);
      publicKeyBox.value = identity;
      navigator.clipboard?.writeText(identity).catch(() => {});
      addSystemMessage("Public identity exported to the box and copied when supported.");
    }

    function renderIdentity() {
      if (peerId && publicJwk) {
        peerStatus.textContent = `Peer: ${peerId}`;
        peerStatus.className = "status-indicator connected";
        fingerprintBox.textContent = `Fingerprint: ${peerId.replace("pk-", "")}`;
        publicKeyBox.value = JSON.stringify({ peer_id: peerId, public_jwk: publicJwk }, null, 2);
      } else {
        peerStatus.textContent = "No identity loaded";
        peerStatus.className = "status-indicator disconnected";
        fingerprintBox.textContent = "";
      }
    }

    async function fingerprintPublicKey(jwk) {
      const canonical = JSON.stringify({ crv: jwk.crv, kty: jwk.kty, x: jwk.x, y: jwk.y });
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(canonical));
      return arrayBufferToHex(digest).slice(0, 16);
    }

    async function signPayload(payload) {
      const signature = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, signingKeyPair.privateKey, new TextEncoder().encode(canonicalMessage(payload)));
      return arrayBufferToBase64(signature);
    }

    async function verifyPayload(payload) {
      if (!payload.public_jwk || !payload.signature) return false;
      const expectedPeer = `pk-${await fingerprintPublicKey(payload.public_jwk)}`;
      if (expectedPeer !== payload.from) return false;
      remotePublicKeys[payload.from] = payload.public_jwk;
      const publicKey = await crypto.subtle.importKey("jwk", payload.public_jwk, { name: "ECDSA", namedCurve: "P-256" }, true, ["verify"]);
      return crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, publicKey, base64ToArrayBuffer(payload.signature), new TextEncoder().encode(canonicalMessage(payload)));
    }

    function canonicalMessage(payload) {
      return JSON.stringify({ type: payload.type, id: payload.id, from: payload.from, to: payload.to, payload: payload.payload, timestamp: payload.timestamp, ttl: payload.ttl, nonce: payload.nonce });
    }

    function connectSignaling() {
      if (!peerId || !signingKeyPair) return alert("Create or load cryptographic identity first.");
      if (ws && ws.readyState === WebSocket.OPEN) return;
      manualDisconnect = false;
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
      ws.onopen = () => {
        signalStatus.textContent = "Connected to signaling";
        signalStatus.className = "status-indicator connected";
        sendSignal({ type: "register", peer_id: peerId, public_jwk: publicJwk });
        startHeartbeat();
        addSystemMessage("Connected to signaling server.");
      };
      ws.onmessage = async (event) => handleSignal(JSON.parse(event.data));
      ws.onclose = () => {
        stopHeartbeat();
        signalStatus.textContent = manualDisconnect ? "Offline" : "Offline - retrying";
        signalStatus.className = "status-indicator disconnected";
        addSystemMessage("Disconnected from signaling server.");
        if (!manualDisconnect) scheduleReconnect();
      };
      ws.onerror = () => {
        signalStatus.textContent = "Signal error";
        signalStatus.className = "status-indicator disconnected";
      };
    }

    function disconnectSignaling() {
      manualDisconnect = true;
      stopHeartbeat();
      if (reconnectTimer) clearTimeout(reconnectTimer);
      if (ws) ws.close();
      ws = null;
      closePeerConnection();
    }

    function scheduleReconnect() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        if (!manualDisconnect && peerId && signingKeyPair) connectSignaling();
      }, 2500);
    }

    function startHeartbeat() {
      stopHeartbeat();
      heartbeatTimer = setInterval(() => sendSignal({ type: "ping" }), 15000);
    }

    function stopHeartbeat() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = null;
    }

    function sendSignal(payload) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify(payload));
    }

    async function handleSignal(message) {
      switch (message.type) {
        case "registered":
        case "presence": peers = (message.peers || []).filter((id) => id !== peerId); renderPeers(); break;
        case "offer": await handleOffer(message); break;
        case "answer": await handleAnswer(message); break;
        case "ice-candidate": await handleIceCandidate(message); break;
        case "pong": break;
        case "error": addSystemMessage(`Signal error: ${message.error}`); break;
        default: console.log("Unknown signal", message);
      }
    }

    function renderPeers() {
      targetPeer.innerHTML = "";
      if (!peers.length) {
        peerList.innerHTML = `<div class="peer-item"><span class="peer-id">No peers online</span></div>`;
        const option = document.createElement("option"); option.value = ""; option.textContent = "No peers online"; targetPeer.appendChild(option); return;
      }
      peerList.innerHTML = peers.map((id) => `<div class="peer-item"><span class="peer-id">${escapeHtml(id)}</span><span class="peer-state">${id === connectedPeer ? "connected" : "available"}</span></div>`).join("");
      peers.forEach((id) => { const option = document.createElement("option"); option.value = id; option.textContent = id; targetPeer.appendChild(option); });
    }

    async function connectToPeer() {
      selectedPeer = targetPeer.value;
      if (!selectedPeer) return alert("No target peer selected.");
      if (!ws || ws.readyState !== WebSocket.OPEN) return alert("Connect signaling first.");
      closePeerConnection(); setupPeerConnection(selectedPeer, true);
      const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
      sendSignal({ type: "offer", to: selectedPeer, sdp: offer });
      addSystemMessage(`Sent WebRTC offer to ${selectedPeer}.`);
    }

    function setupPeerConnection(remotePeer, isInitiator) {
      connectedPeer = remotePeer;
      pc = new RTCPeerConnection({ iceServers });
      pc.onicecandidate = (event) => { if (event.candidate) sendSignal({ type: "ice-candidate", to: remotePeer, candidate: event.candidate }); };
      pc.onconnectionstatechange = () => {
        channelStatus.textContent = `WebRTC: ${pc.connectionState}`;
        channelStatus.className = pc.connectionState === "connected" ? "status-indicator connected" : "status-indicator disconnected";
        if (["failed", "disconnected", "closed"].includes(pc.connectionState)) addSystemMessage(`WebRTC state: ${pc.connectionState}. Queue will retry when channel reopens.`);
        renderPeers();
      };
      pc.ondatachannel = (event) => { dataChannel = event.channel; bindDataChannel(remotePeer); };
      if (isInitiator) { dataChannel = pc.createDataChannel("p2p-chat"); bindDataChannel(remotePeer); }
    }

    function bindDataChannel(remotePeer) {
      dataChannel.onopen = () => {
        connectedPeer = remotePeer;
        channelStatus.textContent = `Direct channel: ${remotePeer}`;
        channelStatus.className = "status-indicator connected";
        sendIdentityHello(remotePeer);
        flushOutbox();
        addSystemMessage(`Direct P2P channel open with ${remotePeer}.`);
        renderPeers();
      };
      dataChannel.onmessage = async (event) => handleDataMessage(JSON.parse(event.data), remotePeer);
      dataChannel.onclose = () => { channelStatus.textContent = "Direct channel closed"; channelStatus.className = "status-indicator disconnected"; addSystemMessage("Direct P2P channel closed."); };
      dataChannel.onerror = () => { channelStatus.textContent = "Direct channel error"; channelStatus.className = "status-indicator disconnected"; };
    }

    async function handleDataMessage(message, remotePeer) {
      if (message.type === "identity-hello") { remotePublicKeys[message.from] = message.public_jwk; addSystemMessage(`Stored public identity for ${message.from}.`); return; }
      if (message.type === "ack") { markAcked(message.id, message.from); return; }
      if (message.type !== "chat") return;
      if (seenMessages.has(message.id)) { sendAck(message); return; }
      seenMessages.add(message.id);
      const verified = await verifyPayload(message).catch(() => false);
      addMessage(message.from || remotePeer, message.payload, verified ? "remote" : "invalid", verified ? `signature verified · delivered ack sent` : "signature invalid");
      if (verified) sendAck(message);
    }

    function sendIdentityHello(remotePeer) {
      if (!dataChannel || dataChannel.readyState !== "open") return;
      dataChannel.send(JSON.stringify({ type: "identity-hello", from: peerId, to: remotePeer, public_jwk: publicJwk }));
    }

    function sendAck(message) {
      if (!dataChannel || dataChannel.readyState !== "open") return;
      dataChannel.send(JSON.stringify({ type: "ack", id: message.id, from: peerId, to: message.from, timestamp: Date.now() }));
    }

    function markAcked(messageId, from) {
      const record = pendingAcks.get(messageId);
      if (record) {
        pendingAcks.delete(messageId);
        outbox = outbox.filter((item) => item.id !== messageId);
        addSystemMessage(`Delivery confirmed by ${from}: ${messageId.slice(0, 8)}`);
      }
    }

    async function handleOffer(message) {
      const remotePeer = message.from; closePeerConnection(); setupPeerConnection(remotePeer, false);
      await pc.setRemoteDescription(new RTCSessionDescription(message.sdp));
      const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
      sendSignal({ type: "answer", to: remotePeer, sdp: answer });
      addSystemMessage(`Accepted WebRTC offer from ${remotePeer}.`);
    }

    async function handleAnswer(message) { if (!pc) return; await pc.setRemoteDescription(new RTCSessionDescription(message.sdp)); addSystemMessage(`Received WebRTC answer from ${message.from}.`); }
    async function handleIceCandidate(message) { if (!pc || !message.candidate) return; try { await pc.addIceCandidate(new RTCIceCandidate(message.candidate)); } catch (_) { addSystemMessage("Failed to add ICE candidate."); } }

    async function sendMessage() {
      const text = input.value.trim(); if (!text) return;
      if (!signingKeyPair) return alert("Create or load identity first.");
      const payload = { type: "chat", id: crypto.randomUUID(), from: peerId, to: connectedPeer || targetPeer.value, payload: text, timestamp: Date.now(), ttl: 8, nonce: crypto.randomUUID(), public_jwk: publicJwk };
      payload.signature = await signPayload(payload);
      queueOrSend(payload);
      addMessage(peerId, text, "local", dataChannel?.readyState === "open" ? "signed · sent · awaiting ack" : "signed · queued");
      input.value = "";
    }

    function queueOrSend(payload) {
      if (!payload.to) { addSystemMessage("No target peer selected. Message not sent."); return; }
      outbox.push(payload);
      if (dataChannel && dataChannel.readyState === "open") transmitPayload(payload);
      else addSystemMessage(`Queued message for ${payload.to}.`);
    }

    function transmitPayload(payload) {
      dataChannel.send(JSON.stringify(payload));
      pendingAcks.set(payload.id, { payload, sentAt: Date.now(), attempts: (pendingAcks.get(payload.id)?.attempts || 0) + 1 });
      setTimeout(() => retryIfUnacked(payload.id), 5000);
    }

    function retryIfUnacked(messageId) {
      const record = pendingAcks.get(messageId);
      if (!record) return;
      if (record.attempts >= 3) { addSystemMessage(`Message still unconfirmed after 3 attempts: ${messageId.slice(0, 8)}`); return; }
      if (dataChannel && dataChannel.readyState === "open") transmitPayload(record.payload);
    }

    function flushOutbox() {
      if (!dataChannel || dataChannel.readyState !== "open") { addSystemMessage(`Queue waiting. Pending messages: ${outbox.length}`); return; }
      outbox.forEach((payload) => { if (!pendingAcks.has(payload.id)) transmitPayload(payload); });
      addSystemMessage(`Retry queue flushed. Pending messages: ${outbox.length}`);
    }

    function closePeerConnection() {
      if (dataChannel) { try { dataChannel.close(); } catch (_) {} }
      if (pc) { try { pc.close(); } catch (_) {} }
      dataChannel = null; pc = null; connectedPeer = "";
      channelStatus.textContent = "No direct channel"; channelStatus.className = "status-indicator disconnected";
    }

    function addMessage(sender, text, kind, signatureState = "") {
      const el = document.createElement("div"); el.className = `message ${kind}`;
      el.innerHTML = `<div class="message-time">[${new Date().toLocaleTimeString()}]</div><div class="message-sender">${escapeHtml(sender)}</div><div class="message-content">${escapeHtml(text)}</div>${signatureState ? `<div class="signature-state">${escapeHtml(signatureState)}</div>` : ""}`;
      messages.appendChild(el); messages.scrollTop = messages.scrollHeight;
    }

    function addSystemMessage(text) { const el = document.createElement("div"); el.className = "message system"; el.innerHTML = `<div class="message-time">[SYSTEM]</div><div class="message-content">${escapeHtml(text)}</div>`; messages.appendChild(el); messages.scrollTop = messages.scrollHeight; }
    function readJson(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; } }
    function arrayBufferToHex(buffer) { return [...new Uint8Array(buffer)].map((b) => b.toString(16).padStart(2, "0")).join(""); }
    function arrayBufferToBase64(buffer) { const bytes = new Uint8Array(buffer); let binary = ""; bytes.forEach((b) => binary += String.fromCharCode(b)); return btoa(binary); }
    function base64ToArrayBuffer(base64) { const binary = atob(base64); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i); return bytes.buffer; }
    function escapeHtml(value) { return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); }

    input.addEventListener("keydown", (event) => { if (event.key === "Enter") sendMessage(); });
    renderIdentity(); renderPeers(); addSystemMessage("P2P Mesh v3.5 loaded. Signed identity, acks, retry queue, heartbeat, and reconnect are active.");
    if (readJson(STORAGE_PUBLIC) && readJson(STORAGE_PRIVATE)) initIdentity();
  </script>
</body>
</html>
